name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  e2e:
    # Runs against the real Supabase project. Add these repository secrets to enable it:
    # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY.
    runs-on: ubuntu-latest
    needs: check
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - id: gate
        run: echo "run=${{ secrets.SUPABASE_SECRET_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run != 'true'
        run: echo "::notice::E2E skipped — Supabase secrets are not set for this repository."
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: pnpm build && pnpm e2e
      - if: steps.gate.outputs.run == 'true'
        name: Lighthouse budgets (§12)
        run: npx -y @lhci/cli@0.15.1 autorun
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
